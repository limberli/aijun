version: '3.8'

services:

  # ── 1. Ollama LLM runtime ───────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      # ollama/ollama:latest не содержит curl — проверяем родным CLI (тот же API).
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── 2. Model pull (one-shot init container) ─────────────────────────────
  # Pulls qwen2.5:7b into the shared ollama_data volume before any agent starts.
  # Uses condition: service_completed_successfully so agents wait for the pull.
  ollama-model-init:
    # Тот же образ, что у сервиса ollama (уже скачан) — пуллим модель родным CLI.
    # OLLAMA_HOST направляет pull на удалённый сервер ollama; контейнер блокируется
    # до завершения скачивания и завершается с кодом 0.
    image: ollama/ollama:latest
    container_name: ollama-model-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    # Не переопределяем entrypoint (он в образе указывает на бинарник ollama) —
    # передаём только аргументы, иначе ollama не находится в $PATH.
    command: ["pull", "qwen2.5:7b"]
    restart: "no"

  # ── 3. Tester Agent ─────────────────────────────────────────────────────
  tester-agent:
    platform: linux/amd64
    build:
      context: .
      dockerfile: tester-agent/Dockerfile
    container_name: tester-agent
    ports:
      - "8081:8081"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:7b
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      ollama-model-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── 4. Analyst Agent ─────────────────────────────────────────────────────
  analyst-agent:
    platform: linux/amd64
    build:
      context: .
      dockerfile: analyst-agent/Dockerfile
    container_name: analyst-agent
    ports:
      - "8082:8082"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:7b
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      ollama-model-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── 5. Host Orchestrator ─────────────────────────────────────────────────
  host-orchestrator:
    platform: linux/amd64
    build:
      context: .
      dockerfile: host-orchestrator/Dockerfile
    container_name: host-orchestrator
    ports:
      - "8080:8080"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      AGENTS_TESTER_URL: http://tester-agent:8081
      AGENTS_ANALYST_URL: http://analyst-agent:8082
      AGENT_PUBLIC_URL: http://host-orchestrator:8080
      SPRING_PROFILES_ACTIVE: prod
    volumes:
      - orchestrator_data:/app/data
    depends_on:
      tester-agent:
        condition: service_healthy
      analyst-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── 6. aijun-ui (AI JUN V2 web interface) ────────────────────────────────
  aijun-ui:
    image: node:22-alpine
    container_name: aijun-ui
    working_dir: /app
    volumes:
      - ./aijun-ui:/app
      # Anonymous volume keeps the container's (linux) node_modules separate from the host's.
      - /app/node_modules
    ports:
      - "5173:5173"
    # Vite dev server; /a2a proxy forwards backend calls to the orchestrator.
    # VITE_PLAN=local — local Ollama model, no limits/billing ("Local model" badge).
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      ORCHESTRATOR_URL: http://host-orchestrator:8080
      VITE_PLAN: local
    depends_on:
      host-orchestrator:
        condition: service_healthy

volumes:
  ollama_data:
  orchestrator_data:
