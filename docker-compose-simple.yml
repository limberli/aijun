version: '3.8'

# Default mode: local Ollama (phi3:mini).
# For Groq cloud API (fast, free tier): use docker-compose-groq.yml instead.
#   export GROQ_API_KEY=gsk_...
#   docker compose -f docker-compose-groq.yml up --build -d

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  ollama-model-init:
    # Тот же образ, что у сервиса ollama (уже скачан) — пуллим модель родным CLI.
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    # Не переопределяем entrypoint (он в образе указывает на бинарник ollama) —
    # передаём только аргументы, иначе ollama не находится в $PATH.
    command: ["pull", "phi3:mini"]
    restart: "no"

  tester-agent:
    platform: linux/amd64
    build:
      context: .
      dockerfile: tester-agent/Dockerfile
    container_name: tester-agent
    ports:
      - "8081:8081"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: phi3:mini
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      - ollama-model-init

  analyst-agent:
    platform: linux/amd64
    build:
      context: .
      dockerfile: analyst-agent/Dockerfile
    container_name: analyst-agent
    ports:
      - "8082:8082"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: phi3:mini
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      - ollama-model-init

  host-orchestrator:
    platform: linux/amd64
    build:
      context: .
      dockerfile: host-orchestrator/Dockerfile
    container_name: host-orchestrator
    ports:
      - "8080:8080"
    environment:
      AGENTS_TESTER_URL: http://tester-agent:8081
      AGENTS_ANALYST_URL: http://analyst-agent:8082
      AGENT_PUBLIC_URL: http://host-orchestrator:8080
      SPRING_PROFILES_ACTIVE: prod
    volumes:
      - orchestrator_data:/app/data
    depends_on:
      - tester-agent
      - analyst-agent

  aijun-ui:
    image: node:22-alpine
    container_name: aijun-ui
    working_dir: /app
    volumes:
      - ./aijun-ui:/app
      # Anonymous volume keeps the container's (linux) node_modules separate from the host's.
      - /app/node_modules
    ports:
      - "5173:5173"
    # Vite dev server; /a2a proxy forwards backend calls to the orchestrator.
    # VITE_PLAN=local — local Ollama model, no limits/billing ("Local model" badge).
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      ORCHESTRATOR_URL: http://host-orchestrator:8080
      VITE_PLAN: local
    depends_on:
      - host-orchestrator

volumes:
  ollama_data:
  orchestrator_data:
