version: '3.8'

# Groq cloud API mode — fast inference, no local Ollama needed.
#
# Setup:
#   1. Register at https://console.groq.com and get a free API key
#   2. export GROQ_API_KEY=gsk_...
#   3. docker compose -f docker-compose-groq.yml up --build -d

services:
  tester-agent:
    platform: linux/amd64
    build:
      context: .
      dockerfile: tester-agent/Dockerfile
    container_name: tester-agent
    ports:
      - "8081:8081"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      SPRING_PROFILES_ACTIVE: prod,groq
      LOG_DIR: /app/logs
    volumes:
      - ./logs/cloud:/app/logs

  analyst-agent:
    platform: linux/amd64
    build:
      context: .
      dockerfile: analyst-agent/Dockerfile
    container_name: analyst-agent
    ports:
      - "8082:8082"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      SPRING_PROFILES_ACTIVE: prod,groq
      LOG_DIR: /app/logs
    volumes:
      - ./logs/cloud:/app/logs

  host-orchestrator:
    platform: linux/amd64
    build:
      context: .
      dockerfile: host-orchestrator/Dockerfile
    container_name: host-orchestrator
    ports:
      - "8080:8080"
    environment:
      AGENTS_TESTER_URL: http://tester-agent:8081
      AGENTS_ANALYST_URL: http://analyst-agent:8082
      AGENT_PUBLIC_URL: http://host-orchestrator:8080
      SPRING_PROFILES_ACTIVE: prod
      LOG_DIR: /app/logs
    volumes:
      - orchestrator_data:/app/data
      - ./logs/cloud:/app/logs
    depends_on:
      - tester-agent
      - analyst-agent

  aijun-ui:
    image: node:22-alpine
    container_name: aijun-ui
    working_dir: /app
    volumes:
      - ./aijun-ui:/app
      # Anonymous volume keeps the container's (linux) node_modules separate from the host's.
      - /app/node_modules
    ports:
      - "5173:5173"
    # Vite dev server; /a2a proxy forwards backend calls to the orchestrator.
    # VITE_PLAN=free — Groq free tier (token limits + in-app token purchase).
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      ORCHESTRATOR_URL: http://host-orchestrator:8080
      VITE_PLAN: free
    depends_on:
      - host-orchestrator

volumes:
  orchestrator_data:
